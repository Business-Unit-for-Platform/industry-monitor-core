[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-monitor-core"
version = "0.1.0"
description = "Shared, domain-neutral adapters for industry monitoring projects"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3,<5",
    "requests>=2.32.3,<3",
]

[tool.setuptools.packages.find]
include = ["industry_monitor_core*"]
